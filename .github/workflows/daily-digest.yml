name: Daily Podcast Digest via Tingwu Xiaoyuzhou

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Report date, YYYY-MM-DD. Empty means today in Asia/Shanghai."
        required: false
        type: string
      dry_run_feishu:
        description: "Generate the report but do not publish to Feishu."
        required: false
        default: false
        type: boolean
      feishu_wiki_url:
        description: "Optional existing Feishu Wiki page URL to overwrite instead of creating a new page."
        required: false
        type: string
  schedule:
    # 06:15 Beijing time (UTC 22:15 previous day), after the 06:00 data window closes.
    - cron: "15 22 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: daily-podcast-digest-tingwu-xiaoyuzhou
  cancel-in-progress: false

jobs:
  daily-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run report validation tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Resolve report date
        id: report_date
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            REPORT_DATE="${{ github.event.inputs.date }}"
          else
            REPORT_DATE="$(TZ=Asia/Shanghai date +'%Y-%m-%d')"
          fi
          echo "date=$REPORT_DATE" >> "$GITHUB_OUTPUT"
          echo "REPORT_DATE=$REPORT_DATE" >> "$GITHUB_ENV"
          echo "REPORT_PATH=reports/daily-${REPORT_DATE}.md" >> "$GITHUB_ENV"
          echo "REPORT_JSON_PATH=reports/daily-${REPORT_DATE}.json" >> "$GITHUB_ENV"
          echo "ITEMS_PATH=reports/daily_items_${REPORT_DATE}.json" >> "$GITHUB_ENV"
          echo "MANIFEST_PATH=reports/daily_items_${REPORT_DATE}.manifest.json" >> "$GITHUB_ENV"
          echo "TINGWU_STATUS_PATH=reports/tingwu_xiaoyuzhou_${REPORT_DATE}.status.json" >> "$GITHUB_ENV"
          echo "YOUTUBE_STATUS_PATH=reports/youtube_external_${REPORT_DATE}.status.json" >> "$GITHUB_ENV"
          echo "VALIDATION_PATH=reports/transcript_validation_${REPORT_DATE}.json" >> "$GITHUB_ENV"
          echo "BUNDLE_PATH=subtitles_bundle.zip" >> "$GITHUB_ENV"

      - name: Check required Tingwu and LLM secrets
        shell: bash
        run: |
          test -n "${{ secrets.TINGWU_APP_KEY }}"
          test -n "${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}"
          test -n "${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}"
          test -n "${{ secrets.LLM_BASE_URL }}"
          test -n "${{ secrets.LLM_API_KEY }}"
          test -n "${{ secrets.LLM_MODEL }}"

      - name: Check required Feishu secrets
        if: ${{ github.event.inputs.dry_run_feishu != 'true' }}
        shell: bash
        run: |
          test -n "${{ secrets.FEISHU_APP_ID }}"
          test -n "${{ secrets.FEISHU_APP_SECRET }}"
          test -n "${{ secrets.FEISHU_WIKI_SPACE_ID }}"
          test -n "${{ secrets.FEISHU_NOTIFY_WEBHOOK }}"

      - name: Check required YouTube transcript service secrets
        shell: bash
        run: |
          test -n "${{ secrets.MEDIA_API_TOKEN }}"

      - name: Collect Xiaoyuzhou and transcribe via Tingwu
        env:
          TINGWU_APP_KEY: ${{ secrets.TINGWU_APP_KEY }}
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          python scripts/tingwu_xiaoyuzhou_daily.py \
            --date "$REPORT_DATE" \
            --timezone "Asia/Shanghai" \
            --items-json "$ITEMS_PATH" \
            --manifest-json "$MANIFEST_PATH" \
            --bundle-path "$BUNDLE_PATH" \
            --status-json "$TINGWU_STATUS_PATH" \
            --subtitles-dir subtitles \
            --max-trailing-gap-seconds 180 \
            --poll-interval 20 \
            --timeout-seconds 18000

      - name: Collect YouTube via external transcript service
        env:
          MEDIA_API_TOKEN: ${{ secrets.MEDIA_API_TOKEN }}
          MEDIA_API_BASE: ${{ vars.MEDIA_API_BASE }}
          YOUTUBE_SOURCES_PROFILE: ${{ vars.YOUTUBE_SOURCES_PROFILE }}
        run: |
          python scripts/youtube_external_daily.py \
            --date "$REPORT_DATE" \
            --timezone "Asia/Shanghai" \
            --items-json "$ITEMS_PATH" \
            --manifest-json "$MANIFEST_PATH" \
            --bundle-path "$BUNDLE_PATH" \
            --status-json "$YOUTUBE_STATUS_PATH" \
            --subtitles-dir subtitles \
            --poll-interval 20 \
            --timeout-seconds 18000

      - name: Validate transcript bundle
        shell: bash
        run: |
          EXTRA_ARGS=()
          if [ "$REPORT_DATE" = "2026-06-30" ]; then
            EXTRA_ARGS+=("--expected-url" "https://www.xiaoyuzhoufm.com/episode/6a41f1212e335a35a80b0159")
            EXTRA_ARGS+=("--expected-url" "https://www.xiaoyuzhoufm.com/episode/6a40b830ffcf45052c805d5f")
            EXTRA_ARGS+=("--expected-url" "https://www.xiaoyuzhoufm.com/episode/6a412def9d2f5743683f320e")
          fi

          python scripts/validate_transcript_bundle.py \
            --items-json "$ITEMS_PATH" \
            --manifest-json "$MANIFEST_PATH" \
            --subtitles-dir subtitles \
            --bundle-zip "$BUNDLE_PATH" \
            --min-coverage 0.95 \
            --min-duration-seconds 300 \
            --max-trailing-gap-seconds 180 \
            --output-json "$VALIDATION_PATH" \
            "${EXTRA_ARGS[@]}"

      - name: Restore completed item digests from earlier runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A failed run uploads its completed item digests. Reuse them on a
          # same-date retry so Qwen is only called for unfinished items.
          RUN_IDS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=daily-digest-${REPORT_DATE}&per_page=20" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[:3][] | .workflow_run.id')"
          for RUN_ID in $RUN_IDS; do
            RESTORE_DIR="${RUNNER_TEMP}/digest-cache-${RUN_ID}"
            gh run download "$RUN_ID" --name "daily-digest-${REPORT_DATE}" --dir "$RESTORE_DIR"
            SOURCE_DIR="${RESTORE_DIR}/reports/digest_cache/${REPORT_DATE}"
            if [ -d "$SOURCE_DIR" ]; then
              mkdir -p "reports/digest_cache/${REPORT_DATE}"
              cp -n "$SOURCE_DIR"/*.json "reports/digest_cache/${REPORT_DATE}/" 2>/dev/null || true
            fi
          done
          echo "Restored $(find "reports/digest_cache/${REPORT_DATE}" -maxdepth 1 -name '*.json' 2>/dev/null | wc -l) completed item digest(s)."

      - name: Generate daily report from full transcripts
        id: generate_report
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_WORKSPACE_ID: ${{ secrets.LLM_WORKSPACE_ID }}
          LLM_USE_WORKSPACE_BASE: "0"
          LLM_TIMEOUT: "900"
          LLM_CHUNK_CHARS: "30000"
          LLM_RETRY_ATTEMPTS: "4"
          LLM_RETRY_BASE_SECONDS: "2"
          LLM_RETRY_MAX_SECONDS: "30"
          LLM_FINAL_PAYLOAD_CHARS: "18000"
          LLM_FINAL_PAYLOAD_CHARS_RETRY: "8000"
          LLM_NEUTRAL_ARCHIVE_PREAMBLE: "0"
          LLM_REASONING_EFFORT: "medium"
          LLM_MAX_COMPLETION_TOKENS: "12000"
          LLM_RESPONSE_FORMAT: "json_object"
          LLM_INLINE_DIRECT_ENABLED: "1"
          LLM_INLINE_MAX_CHARS: "0"
          LLM_FILEID_ENABLED: "0"
          LLM_FILEID_DIRECT_ENABLED: "0"
          # In production, every item stays in the complete-transcript context.
          LLM_EVIDENCE_FALLBACK_ENABLED: "0"
          # Do not publish a report with a missing item summary.
          LLM_ITEM_FAILURE_POLICY: "fail"
          # Never publish a metadata-only digest as a successful required run.
          LLM_METADATA_FALLBACK_ENABLED: "0"
        run: |
          python scripts/generate_daily_report.py \
            --date "$REPORT_DATE" \
            --items-json "$ITEMS_PATH" \
            --subtitles-dir subtitles \
            --require-transcripts \
            --llm-policy required \
            --llm-max-attempts 3 \
            --digest-cache-dir reports/digest_cache \
            --output "$REPORT_PATH" \
            --output-json "$REPORT_JSON_PATH"

      - name: Publish to Feishu Wiki and notify group
        id: publish_report
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_WIKI_SPACE_ID: ${{ secrets.FEISHU_WIKI_SPACE_ID }}
          FEISHU_NOTIFY_WEBHOOK: ${{ secrets.FEISHU_NOTIFY_WEBHOOK }}
          FEISHU_PINNED_WIKI_TITLE: "🎧 播客蒸馏室"
          FEISHU_WIKI_URL: ${{ github.event.inputs.feishu_wiki_url }}
        shell: bash
        run: |
          EXTRA_ARGS=()
          if [ "${{ github.event.inputs.dry_run_feishu }}" = "true" ]; then
            EXTRA_ARGS+=("--dry-run")
          fi
          if [ -n "$FEISHU_WIKI_URL" ]; then
            EXTRA_ARGS+=("--wiki-url" "$FEISHU_WIKI_URL")
          fi
          python scripts/publish_feishu.py \
            --file "$REPORT_PATH" \
            --title "${REPORT_DATE} 播客与视频更新日报" \
            "${EXTRA_ARGS[@]}"

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-digest-${{ steps.report_date.outputs.date }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ env.REPORT_PATH }}
            ${{ env.REPORT_JSON_PATH }}
            ${{ env.ITEMS_PATH }}
            ${{ env.MANIFEST_PATH }}
            ${{ env.TINGWU_STATUS_PATH }}
            ${{ env.YOUTUBE_STATUS_PATH }}
            ${{ env.VALIDATION_PATH }}
            ${{ env.BUNDLE_PATH }}
            subtitles/
            reports/evidence/
            reports/digest_cache/
      - name: Send failure notification to Feishu
        if: failure()
        env:
          FEISHU_NOTIFY_WEBHOOK: ${{ secrets.FEISHU_NOTIFY_WEBHOOK }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT_DATE: ${{ steps.report_date.outputs.date }}
          REPORT_OUTCOME: ${{ steps.generate_report.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish_report.outcome }}
        shell: python
        run: |
          import os, json, urllib.request

          webhook = os.getenv("FEISHU_NOTIFY_WEBHOOK")
          if not webhook:
              print("FEISHU_NOTIFY_WEBHOOK is not set; skipping failure notification.")
              exit(0)

          date_str = os.getenv("REPORT_DATE") or "今日"
          run_url = os.getenv("WORKFLOW_RUN_URL", "")
          if os.getenv("PUBLISH_OUTCOME") == "failure":
              detail = "日报已生成，但飞书写入或目录校验失败。页面可能已写入，请打开运行日志确认后再重试。"
          elif os.getenv("REPORT_OUTCOME") == "failure":
              detail = "日报生成失败，请打开运行日志查看具体原因。"
          else:
              detail = "任务执行失败，请打开运行日志查看具体原因。"

          card = {
              "msg_type": "interactive",
              "card": {
                  "header": {
                      "title": {"tag": "plain_text", "content": f"⚠️ 播客蒸馏任务执行失败 ({date_str})"},
                      "template": "red",
                  },
                  "elements": [
                      {
                          "tag": "markdown",
                          "content": f"**任务执行异常中止**\n{detail}",
                      },
                      {
                          "tag": "action",
                          "actions": [
                              {
                                  "tag": "button",
                                  "text": {"tag": "plain_text", "content": "查看 GitHub 失败日志"},
                                  "url": run_url,
                                  "type": "danger",
                              }
                          ],
                      },
                  ],
              },
          }

          req = urllib.request.Request(
              webhook,
              data=json.dumps(card).encode("utf-8"),
              headers={"Content-Type": "application/json"},
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  print(f"Feishu failure notification sent (HTTP {resp.status}).")
          except Exception as exc:
              print(f"Failed to send Feishu failure notification: {exc}")
